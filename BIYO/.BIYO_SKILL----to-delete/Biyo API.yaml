  /api/v1/stock-movements/{movement_id}/complete/:
    post:
      operationId: complete_stock_movement
      description: |-
        Complete a stock movement and update inventory levels. This action is irreversible.

            When a movement is completed:
            - For **Stock In**: Adds the quantity to the store's inventory
            - For **Stock Out**: Removes the quantity from the store's inventory
            - For **Stock Adjustment**: Sets the inventory to the specified quantity
            - For **Stock Transfer**: Removes quantity from source store and adds to destination store

            The movement must have at least one item and be in 'pending' status to be completed.
      summary: Complete a Stock Movement
      parameters:
      - in: path
        name: movement_id
        schema:
          type: integer
        required: true
      tags:
      - Stock Movements
      security:
      - tokenAuth: []
      - cookieAuth: []
      - BearerAuth: []
      - TokenAuth: []
      responses:
        '200':
          description: No response body
