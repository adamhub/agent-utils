  /api/v1/stock-movements/create/:
    post:
      operationId: create_stock_movement
      description: "Create a new stock movement (Stock In, Stock Out, Stock Adjustment,\
        \ or Stock Transfer).\n\n    Movement Types:\n    - **stock_in**: Add stock\
        \ to a store\n    - **stock_out**: Remove stock from a store\n    - **stock_adjustment**:\
        \ Adjust stock to a specific value\n    - **stock_movement**: Transfer stock\
        \ from one store to another\n\n    Document Number: If not provided, it will\
        \ be auto-generated in format: MOVEMENTTYPE + YYYYMMDDHHMM (e.g., STOCK_IN202510162130)\n\
        \    \n    After creating a movement, add items to it using the add-item endpoint,\
        \ then complete it using the complete endpoint."
      summary: Create a new Stock Movement
      tags:
      - Stock Movements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockMovement'
            examples:
              StockInExample(auto-generatedDocumentNumber):
                value:
                  movement_type: stock_in
                  store: 1
                  notes: Received new inventory
                  status: draft
                summary: Stock In Example (auto-generated document number)
              StockTransferExample(customDocumentNumber):
                value:
                  movement_type: stock_movement
                  store: 1
                  destination_store: 2
                  document_number: STOCK_MOVEMENT202510162130
                  notes: Transfer to Store B
                  status: draft
                summary: Stock Transfer Example (custom document number)
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StockMovement'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StockMovement'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - BearerAuth: []
      - TokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovement'
          description: ''
