        * `Pacific/Pitcairn` - Pacific/Pitcairn
        * `Pacific/Pohnpei` - Pacific/Pohnpei
        * `Pacific/Port_Moresby` - Pacific/Port_Moresby
        * `Pacific/Rarotonga` - Pacific/Rarotonga
        * `Pacific/Saipan` - Pacific/Saipan
        * `Pacific/Tahiti` - Pacific/Tahiti
        * `Pacific/Tarawa` - Pacific/Tarawa
        * `Pacific/Tongatapu` - Pacific/Tongatapu
        * `Pacific/Wake` - Pacific/Wake
        * `Pacific/Wallis` - Pacific/Wallis
        * `US/Alaska` - US/Alaska
        * `US/Arizona` - US/Arizona
        * `US/Central` - US/Central
        * `US/Eastern` - US/Eastern
        * `US/Hawaii` - US/Hawaii
        * `US/Mountain` - US/Mountain
        * `US/Pacific` - US/Pacific
        * `UTC` - UTC
    TokenRefresh:
      type: object
      description: Serializer for token refresh request
      properties:
        refresh_token:
          type: string
      required:
      - refresh_token
    TokenRequest:
      type: object
      description: Serializer for OAuth token request (password grant)
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    TokenResponse:
      type: object
      description: Serializer for OAuth token response
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
        token_type:
          type: string
        employee:
          type: string
          readOnly: true
      required:
      - access_token
      - employee
      - expires_in
      - token_type
    Type679Enum:
      enum:
      - 0
      - 1
      - 2
      - 3
      type: integer
      description: |-
        * `0` - Store Order
        * `1` - Online Order
        * `2` - Warehouse Order
        * `3` - E-commerce Order
    VoidReportOrder:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        item_voided:
          type: string
          readOnly: true
        voided_total_value:
          type: string
          readOnly: true
      required:
      - id
      - item_voided
      - voided_total_value
    WeekdayTotal:
      type: object
      description: Serializer for weekday totals
      properties:
        day:
          type: string
        sales:
          type: number
          format: double
        orders:
          type: integer
      required:
      - day
      - orders
      - sales
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
      description: OAuth 2.0 Bearer token authentication. Obtain token via /api/v1/auth/token/
    TokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Legacy token authentication. Format: Authorization: <token>'
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
tags:
- name: Authentication
  description: "Biyo supports two authentication methods:\n        <br><br>\n    \
    \    <strong>1. OAuth 2.0 Password Grant (Recommended)</strong><br>\n        Authenticate\
    \ with email and password to obtain access tokens:<br>\n        - POST /api/v1/auth/token/\
    \ - Login and get access token<br>\n        - POST /api/v1/auth/token/refresh/\
    \ - Refresh expired access token<br>\n        - POST /api/v1/auth/logout/ - Revoke\
    \ tokens<br>\n        <br>\n        Access tokens expire after 24 hours. Refresh\
    \ tokens expire after 30 days.<br>\n        <br>\n        <strong>Example:</strong><br>\n\
    \        Authorization: Bearer &lt;access_token&gt;<br>\n        <br>\n      \
    \  <strong>2. Legacy Token Authentication</strong><br>\n        Use pre-generated\
    \ API tokens from the admin panel:<br>\n        Authorization: &lt;your_token&gt;\n\
    \        "
- name: Ordering
  description: "Biyo API comes with a very handy set of endpoints to manage your orders.\n\
    \            You can create, update, delete, and retrieve orders as per your requirements.\n\
    \            "
- name: Reporting
  description: |-
    Biyo provides a set of reports that can be accessed through the API.
                These reports gives you one step closer to understanding your business and making data-driven decisions.
- name: Stores
  description: Biyo Stores
- name: Terminals
  description: Biyo Terminals
- name: Tax Rates
  description: Biyo Tax Rates
- name: Printers
  description: Biyo Printers
- name: Categories
  description: Biyo API has a very handy set of tools to add products and categories.
- name: Products
  description: Biyo API has a very handy set of tools to add products and categories.
- name: Modifier Groups
  description: "Modifier Groups are a set of modifiers that can be added to a Modifier.\n\
    \            "
- name: Modifiers
  description: "Modifiers are additional items that can be added to a product.\n \
    \           For example, a pizza can have a modifier of extra cheese and toppings.\
    \ Biyo API\n            gives you full control over modifiers and allows you to\
    \ add same modifiers to\n            multiple <a href=\"./#tag/Products\">Products</a>\
    \ at the same time.\n            "
- name: Discounts
  description: |-
    Biyo offers custom discounts that can be applied to orders.
                You can create, update, delete, and retrieve discounts as per your requirements.
- name: Customer Groups
  description: You can manage your customers into groups.
- name: Customers
  description: |-
    Biyo API allows you to manage your customers. Just like any other
                entity, you can `create`, `update`, `delete`, and `retrieve` customers.
- name: Employees
  description: |-
    Biyo API allows you to manage your employees. Just like any other
                entity, you can `create`, `update`, `delete`, and `retrieve` employees.
