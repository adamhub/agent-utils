  /api/v1/auth/logout/:
    post:
      operationId: logout
      description: Revoke all OAuth tokens for the authenticated employee
      summary: Logout
      tags:
      - Authentication
      security:
      - tokenAuth: []
      - cookieAuth: []
      - BearerAuth: []
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
                description: Unspecified response body
          description: ''
  /api/v1/auth/token/:
    post:
      operationId: obtain_token
      description: Authenticate with email and password to obtain access token and
        refresh token
      summary: Obtain Access Token
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
            examples:
              LoginRequest:
                value:
                  email: employee@example.com
                  password: password123
                summary: Login Request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - BearerAuth: []
      - TokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
                description: Unspecified response body
          description: ''
  /api/v1/auth/token/refresh/:
    post:
